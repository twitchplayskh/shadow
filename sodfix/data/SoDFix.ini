; Lebensbaum 0.14.0 (SoDFix) — Shadow of Destiny / Shadow of Memories (PC)
; Delete dinput8.dll to return to the completely unmodified game.

[General]
; 0 = load the DLL but apply no patches (pure pass-through)
Enabled=1
; SoDFix.log is written next to shadow.exe (Windows may redirect it to
; %LOCALAPPDATA%\VirtualStore\Program Files (x86)\Konami\Shadow Of Destiny)
Log=1

[Display]
; Adds 1440 x 1080, 1920 x 1440 and 2880 x 2160 to GRAPHIC SETTING > RESOLUTION.
ExtendedResolutionMenu=1

; Adds a SCREEN MODE row under RESOLUTION: BORDERLESS / FULLSCREEN.
ScreenModeMenu=1

; Current screen mode (the menu writes this when you confirm and leave the page).
; Both fill the whole monitor at its native resolution with the 4:3 picture centred and
; black bars, so every RESOLUTION works in both (2880 x 2160 = native 4:3 on 4K).
;   1 = BORDERLESS  borderless full-screen window, above the taskbar while it has focus;
;                   alt-tab away and other windows can go on top of it
;   2 = FULLSCREEN  always on top
ScreenMode=1

; 1 = ignore the menu and always render at Width x Height (0/0 = screen height x 4/3).
OverrideResolution=0
Width=0
Height=0

; ANTI-ALIASING row in GRAPHIC SETTING (the menu writes this). Needs the SoD-RT d3d9.dll.
;   0 = OFF, 1 = SMAA (edge smoothing, applied to the whole picture just before it is shown)
AntiAliasing=0

; TEXTURE FILTERING row in GRAPHIC SETTING (the menu writes this). Needs the SoD-RT d3d9.dll.
;   0 = STANDARD (the game's own filtering), 1 = TRILINEAR (mipmaps: no texture shimmer),
;   2 = ANISOTROPIC (mipmaps + 16x anisotropic: also sharp on floors and walls seen at an angle)
TextureFiltering=0

; AMBIENT OCCLUSION row in GRAPHIC SETTING (the menu writes this). Needs the SoD-RT d3d9.dll.
;   0 = OFF, 1 = LOW, 2 = HIGH (GTAO from the depth buffer: soft shading in corners, creases and where
;   things touch the floor; applied before see-through effects and the HUD)
AmbientOcclusion=0

; REFLECTIONS row in GRAPHIC SETTING (the menu writes this). Needs the SoD-RT d3d9.dll and d3d8.dll.
;   0 = OFF, 1 = LOW, 2 = HIGH (screen-space reflections on the polished floors, marble and water listed in
;   SoDFix\reflect.txt, which was generated from the game's ccc.wad; HIGH traces twice as many steps)
Reflections=0

; TEXTURE UPSCALING row in GRAPHIC SETTING (the menu writes this). Needs the SoD-RT d3d9.dll.
;   0 = OFF, 1 = 2X, 2 = 3X, 3 = 4X (textures are enlarged on the GPU, then refined by a Real-ESRGAN network in the
;   background and cached in %LOCALAPPDATA%\SoDRT\texcache; text is redrawn sharply instead). Lower settings use
;   less video memory and less GPU time per frame. A change applies to textures loaded after it (next area).
TextureUpscaling=3

; IMPROVED GEOMETRY row in GRAPHIC SETTING (the menu writes this; applies straight away). Needs the SoD-RT d3d9.dll.
;   0 = OFF (the original look), 1 = ON: the cobbled streets listed in SoDFix\geometry.txt are laid out seamlessly
;   in world space instead of one rotated tile per polygon, with no visible repeats. Lighting stays the game's own.
ImprovedGeometry=0

; CINEMATIC BARS row in DISPLAY SETTING (the menu writes this as soon as it changes). Needs the SoD-RT d3d9.dll.
;   1 = ON (the game's black bars in cutscenes), 0 = OFF (full-height picture; the game renders it anyway)
CinematicBars=1
; SMOOTH CAMERA (DISPLAY SETTING): evens out the follow camera while walking. 1 = on, 0 = off
SmoothCamera=1

[Shadows]
; RT SHADOW CASTING row in GRAPHIC SETTING (under SHADOW CASTING). The menu writes this.
;   0 = OFF, 1 = MEDIUM (sharp), 2 = HIGH (soft), 3 = ULTRA (soft, more rays)
; Turning it on sets SHADOW CASTING to OFF; turning SHADOW CASTING back on sets it to OFF.
; Needs the SoD-RT d3d9.dll and sod_rt64.exe and a GPU with hardware ray tracing.
RayTracing=0

[Controls]
; LAYOUT row in CONTROLLER SETTING, shown under TYPE when TYPE is KEYBOARD (the menu writes this when you
; confirm and leave the options).
;   0 = CLASSIC  the original keys
;   1 = MODERN   W A S D move, E / Space talk/inspect/select, Q cancel/skip, Tab inventory, M map,
;                Z / C rotate camera, V change view, Esc / P pause. The original keys keep working too.
KeyboardLayout=0
