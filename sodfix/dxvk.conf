# DXVK config for Shadow of Destiny (shadow.exe: Direct3D 8 -> DXVK d3d8 -> d3d9 -> Vulkan)
# Lives next to shadow.exe. DXVK writes shadow_d3d8.log / shadow_d3d9.log here
# (or under %LOCALAPPDATA%\VirtualStore\... because the game is in Program Files).

# Uncomment to show the DXVK overlay and confirm Vulkan is active:
# dxvk.hud = devinfo,fps,api,version

# Leave the frame rate alone: the game requests PRESENT_INTERVAL_ONE in fullscreen,
# and the coupling between its simulation and render timing has not been verified yet.

# Ray-traced shadows read the characters back from the game's vertex buffers every frame: keep those buffers
# in CPU-cached memory (much faster to read). Also set by DXVK's built-in profile for shadow.exe / shadow_lb.exe.
d3d9.cachedWriteOnlyBuffers = True
